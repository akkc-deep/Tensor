spring:
  datasource:
    url: ${TENSOR_DB_URL}
    username: ${TENSOR_DB_USERNAME}
    password: ${TENSOR_DB_PASSWORD}
  flyway:
    enabled: true

tensor:
  display-zone: ${TENSOR_DISPLAY_ZONE:Asia/Shanghai}
  plugins:
    tushare-pro:
      enabled: ${TENSOR_TUSHARE_ENABLED:true}
      base-url: ${TENSOR_TUSHARE_BASE_URL:https://api.tushare.pro}
      token: ${TENSOR_TUSHARE_TOKEN:}
      connect-timeout: 5s
      read-timeout: 120s
      max-response-bytes: 67108864
  persistence:
    batch-size: 500
  query:
    default-page-size: 50
    allowed-page-sizes: [20, 50, 100]

management:
  endpoints:
    web:
      base-path: /actuator
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
    env:
      show-values: never
    configprops:
      show-values: never
  health:
    db:
      enabled: true
