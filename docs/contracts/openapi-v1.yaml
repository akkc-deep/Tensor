openapi: 3.1.0
info:
  title: Tensor v1 REST API
  version: v1
  description: >-
    Shared REST contract for Tensor v1 metadata, downloads, persistent download tasks,
    and read-only dataset queries. Task versions, counts, totals and rowLimit are int64
    JSON numbers up to 9223372036854775807. JavaScript Number is exact only through
    9007199254740991: use lossless JSON parsing and preserve exact decimal digits when
    displaying larger values or sending expectedVersion. Never round or truncate.
    Historical securities LONG and DECIMAL values retain their existing string format.
    Task examples are in download-task-examples.json; error semantics are in error-codes.md.
paths:
  /api/v1/data-sources:
    get:
      operationId: listDataSources
      responses:
        '200':
          description: Registered data sources.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DataSourceSummary'}}
        '500': &internalError
          description: Internal processing failure.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/data-sources/{pluginId}/apis:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: listPluginApis
      responses:
        '200':
          description: API descriptors for the data source.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ApiDescriptor'}}
        '409': &pluginDisabled
          description: A registered plugin is disabled.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500': *internalError
  /api/v1/downloads:
    post:
      operationId: downloadDataset
      description: >-
        Download using the selected API's declared parameters. For Tushare Pro, the 34 APIs
        that support stock input require one params.ts_code, including the 26 newly stock-scoped
        APIs. Existing date, exchange and listing-status requirements still apply.
        trade_cal, new_share, repurchase, margin, slb_len and index_classify retain their
        original parameters without ts_code. See download-request-examples.json for all 40 requests.
        Missing or blank required stock codes fail with PARAM_REQUIRED; invalid or multiple codes
        fail with PARAM_INVALID before any upstream call. Codes are trimmed and uppercased.
        A nonempty stock-scoped response containing missing or different stock codes fails with
        SOURCE_PAYLOAD_INVALID (502) and is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DownloadRequest'}
            examples:
              dailyDownload:
                value: {pluginId: tushare_pro, apiName: daily, params: {ts_code: '000001.SZ', trade_date: '20260807'}}
              dateOnlyDownload:
                value: {pluginId: tushare_pro, apiName: slb_len, params: {trade_date: '20260807'}}
              parameterlessDownload:
                value: {pluginId: tushare_pro, apiName: index_classify, params: {}}
      responses:
        '200':
          description: A committed successful or valid empty download.
          headers:
            X-Request-Id:
              required: true
              description: Matches the requestId in this response body.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadResponse'}
              examples:
                success:
                  value: {requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33, outcome: SUCCESS, pluginId: tushare_pro, apiName: daily, sourceRowCount: 1, insertedRows: 1, updatedRows: 0, message: 下载成功}
                empty:
                  value: {requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33, outcome: EMPTY, pluginId: tushare_pro, apiName: monthly, sourceRowCount: 0, insertedRows: 0, updatedRows: 0, message: 下载成功，0 条数据}
        '400': &parameterInvalid
          description: Input validation failure.
          headers:
            X-Request-Id:
              required: true
              description: Matches the requestId in this error body.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                invalidDateRange:
                  value: {requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33, code: PARAM_INVALID, message: 开始日期不能晚于结束日期, retryable: false, fieldErrors: [{field: start_date, message: 必须早于或等于结束日期}]}
        '409': *pluginDisabled
        '422': &adapterFieldMissing
          description: Adapted data has a required source field missing or violates a declared type constraint.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500': &persistenceFailed
          description: Persistence failed; the database may have committed before its receipt was lost. A rollback is not guaranteed.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '502': &sourceUnavailable
          description: Source processing failure.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '504': &sourceTimeout
          description: The source did not respond in time.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/data-sources/{pluginId}/datasets:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: listPluginDatasets
      responses:
        '200':
          description: Dataset summaries.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DatasetSummary'}}
        '409': &datasetMisconfigured
          description: Dataset metadata is incomplete or inconsistent.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500': *internalError
  /api/v1/data-sources/{pluginId}/datasets/{apiName}:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
      - {name: apiName, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: getDatasetDefinition
      responses:
        '200':
          description: Full dataset display metadata.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetDefinitionResponse'}
        '409': *datasetMisconfigured
        '500': *internalError
  /api/v1/data-sources/{pluginId}/datasets/{apiName}/records:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
      - {name: apiName, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: listDatasetRecords
      description: Each optional filter is accepted only when the selected dataset metadata declares the corresponding filter; an undeclared filter is rejected as PARAM_INVALID. A requested page beyond the valid range after data changes is normalized to the new last page.
      parameters:
        - {name: tsCode, in: query, required: false, description: Accepted only when dataset metadata declares the ts_code filter., schema: {type: string}}
        - {name: tradeDateFrom, in: query, required: false, description: Accepted only when dataset metadata declares the trade_date filter., schema: {type: string, format: date}}
        - {name: tradeDateTo, in: query, required: false, description: Accepted only when dataset metadata declares the trade_date filter., schema: {type: string, format: date}}
        - {name: annDateFrom, in: query, required: false, description: Accepted only when dataset metadata declares the ann_date filter., schema: {type: string, format: date}}
        - {name: annDateTo, in: query, required: false, description: Accepted only when dataset metadata declares the ann_date filter., schema: {type: string, format: date}}
        - {name: page, in: query, required: false, description: One-based requested page; an out-of-range page is normalized to the new last page., schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, enum: [20, 50, 100], default: 50}}
      responses:
        '200':
          description: A normalized page; an empty result has zero totals and an empty items array. An out-of-range request is returned as the new last page.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageResponse'}
              examples:
                records:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    pluginId: tushare_pro
                    apiName: daily
                    page: 1
                    pageSize: 50
                    totalElements: 1
                    totalPages: 1
                    columns: [ts_code, trade_date, open, volume, source_plugin, source_api, ingested_at]
                    items:
                      - {ts_code: 000001.SZ, trade_date: '2026-08-07', open: '11.230000000000000000', volume: '9223372036854775807', source_plugin: tushare_pro, source_api: daily, ingested_at: '2026-08-25T10:30:15.123+08:00'}
        '400':
          description: Query parameter validation failure.
          headers:
            X-Request-Id:
              required: true
              description: Matches the requestId in this error body.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                invalidDateRange:
                  value: {requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33, code: PARAM_INVALID, message: tradeDateFrom 不能晚于 tradeDateTo, retryable: false, fieldErrors: [{field: tradeDateFrom, message: 必须早于或等于 tradeDateTo}]}
        '409': *datasetMisconfigured
        '500': &queryFailed
          description: The read query could not be completed.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/download-tasks:
    post:
      operationId: submitDownloadTask
      description: >-
        Durably accept a SINGLE or RANGE task. A new submission returns 202 after the
        acceptance transaction, without waiting for the source or worker. The receipt
        is not download success. An equivalent submissionId replay returns 200 with
        the original task, version and createdAt, even when new admission is disabled.
        A changed request with the same submissionId is SUBMISSION_CONFLICT.
        No query parameters are accepted. The JSON body must contain exactly the five
        required fields; params is a string-valued object. Duplicate JSON members,
        unknown fields and trailing JSON values are rejected. Invalid present top-level
        values take precedence over missing required fields. UUIDs require the full
        8-4-4-4-12 hexadecimal form; either case is accepted and normalized to lowercase.
        Production Tushare RANGE remains NEEDS_VERIFICATION for 34 APIs; the remaining
        six APIs are SINGLE-only. AVAILABLE RANGE examples are controlled fixtures.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DownloadTaskSubmissionRequest'}
      responses:
        '202':
          description: New task durably accepted; GET may already show a later worker status.
          headers:
            X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
            Location: {$ref: '#/components/headers/DownloadTaskLocation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTaskReceipt'}
        '200':
          description: Equivalent replay found the original task; no new work was accepted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
            Location: {$ref: '#/components/headers/DownloadTaskLocation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTaskReceipt'}
        '400': {$ref: '#/components/responses/DownloadTaskBadRequest'}
        '409': {$ref: '#/components/responses/DownloadTaskConflict'}
        '429': {$ref: '#/components/responses/DownloadTaskQueueFull'}
        '500': {$ref: '#/components/responses/DownloadTaskFailure'}
        '422': {$ref: '#/components/responses/DownloadTaskAdapterFailure'}
        '502': {$ref: '#/components/responses/DownloadTaskSourceFailure'}
        '504': {$ref: '#/components/responses/DownloadTaskSourceTimeout'}
    get:
      operationId: listDownloadTasks
      description: >-
        Filters combine with AND; pluginId and apiName can be used independently and
        need not identify a currently installed plugin. Unknown submissionId is an empty
        page, not 404. Only the listed query parameters are accepted; unknown, duplicate,
        empty or whitespace values are PARAM_INVALID. Status is case-sensitive.
        The initial query fixes total, member IDs and ordering; each item then comes
        from one task/counts snapshot. Rows may reflect different instants or changed
        statuses; members are not re-filtered, re-sorted or filled in. Any detail read
        failure fails the entire response. A page beyond the end stays unchanged.
        Stored task or batch failures, including SOURCE_TIMEOUT and PERSISTENCE_FAILED,
        remain HTTP 200; 500 means this query itself failed. Controls are current hints.
      parameters:
        - {$ref: '#/components/parameters/DownloadTaskPage'}
        - {$ref: '#/components/parameters/DownloadTaskPageSize'}
        - {name: pluginId, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
        - {name: apiName, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
        - {name: status, in: query, schema: {$ref: './download-task.schema.json#/$defs/TaskStatus'}}
        - {name: submissionId, in: query, schema: {$ref: './download-task.schema.json#/$defs/UUID'}}
      responses:
        '200':
          description: Task page with a fixed initial membership and per-row snapshot consistency.
          headers:
            X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTaskPage'}
        '400': {$ref: '#/components/responses/DownloadTaskBadRequest'}
        '500': {$ref: '#/components/responses/DownloadTaskFailure'}
  /api/v1/download-tasks/{taskId}:
    parameters:
      - {$ref: '#/components/parameters/DownloadTaskId'}
    get:
      operationId: getDownloadTask
      description: >-
        Return one consistent task/counts snapshot with current canRetry/canResume hints.
        No query parameters are accepted. Failed or interrupted tasks are HTTP 200;
        a missing task is 404. Internal permission, hash, policy and run fields are omitted.
      responses:
        '200':
          description: Current task snapshot, including any safely classified stored failure.
          headers:
            X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTaskResponse'}
        '400': {$ref: '#/components/responses/DownloadTaskBadRequest'}
        '404': {$ref: '#/components/responses/DownloadTaskNotFound'}
        '500': {$ref: '#/components/responses/DownloadTaskFailure'}
  /api/v1/download-tasks/{taskId}/batches:
    parameters:
      - {$ref: '#/components/parameters/DownloadTaskId'}
    get:
      operationId: listDownloadTaskBatches
      description: >-
        Only page, pageSize, status and includeSplit are accepted. Unknown, duplicate,
        empty or whitespace query values are rejected. includeSplit accepts only the
        lowercase literal true or false, default false. SPLIT parents are excluded
        unless includeSplit=true; status=SPLIT&includeSplit=false is a valid empty page.
        Status is case-sensitive. Batch ranges are YYYY-MM-DD; SINGLE ranges are null.
        Stored batch failures remain HTTP 200. An out-of-range page is returned unchanged.
      parameters:
        - {$ref: '#/components/parameters/DownloadTaskPage'}
        - {$ref: '#/components/parameters/DownloadTaskPageSize'}
        - {name: status, in: query, schema: {$ref: './download-task.schema.json#/$defs/BatchStatus'}}
        - {name: includeSplit, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Persisted batch page; total and records come from the query service.
          headers:
            X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadBatchPage'}
        '400': {$ref: '#/components/responses/DownloadTaskBadRequest'}
        '404': {$ref: '#/components/responses/DownloadTaskNotFound'}
        '500': {$ref: '#/components/responses/DownloadTaskFailure'}
  /api/v1/download-tasks/{taskId}/retry:
    parameters:
      - {$ref: '#/components/parameters/DownloadTaskId'}
    post:
      operationId: retryDownloadTask
      description: >-
        Explicitly retry FAILED or PARTIAL_FAILED, resetting only failed leaves. Body
        contains only the client's expectedVersion as a positive int64 JSON integer
        token. Strings, fractions, exponent spellings, duplicates and extra fields
        are rejected; no query parameters are accepted. State/version, lifecycle,
        active lease, current definition, readiness and queue capacity are revalidated.
        A receipt failure may follow a committed requeue: query before trying again.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DownloadTaskControlRequest'}
      responses:
        '202':
          description: Retry accepted for the same task; createdAt is the original creation time.
          headers:
            X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
            Location: {$ref: '#/components/headers/DownloadTaskLocation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTaskReceipt'}
        '400': {$ref: '#/components/responses/DownloadTaskBadRequest'}
        '404': {$ref: '#/components/responses/DownloadTaskNotFound'}
        '409': {$ref: '#/components/responses/DownloadTaskConflict'}
        '429': {$ref: '#/components/responses/DownloadTaskQueueFull'}
        '500': {$ref: '#/components/responses/DownloadTaskFailure'}
  /api/v1/download-tasks/{taskId}/resume:
    parameters:
      - {$ref: '#/components/parameters/DownloadTaskId'}
    post:
      operationId: resumeDownloadTask
      description: >-
        Explicitly resume INTERRUPTED while preserving successful leaves and ordinary
        failed batches. Uses the exact client expectedVersion with the same strict
        body and revalidation rules as retry. No query parameters are accepted.
        No automatic retry or resume occurs after restart or an ambiguous receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DownloadTaskControlRequest'}
      responses:
        '202':
          description: Resume accepted for the same task; createdAt is the original creation time.
          headers:
            X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
            Location: {$ref: '#/components/headers/DownloadTaskLocation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTaskReceipt'}
        '400': {$ref: '#/components/responses/DownloadTaskBadRequest'}
        '404': {$ref: '#/components/responses/DownloadTaskNotFound'}
        '409': {$ref: '#/components/responses/DownloadTaskConflict'}
        '429': {$ref: '#/components/responses/DownloadTaskQueueFull'}
        '500': {$ref: '#/components/responses/DownloadTaskFailure'}
  /api/v1/data-sources/{pluginId}/apis/{apiName}/download-capabilities:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
      - {name: apiName, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: getDownloadCapabilities
      description: >-
        Return SINGLE and RANGE capability metadata without metadata-list downloadability
        filtering. Known disabled sources remain queryable with single.available=false
        and an unavailable RANGE. Unknown identity is DATASET_MISCONFIGURED (409).
        No query parameters are accepted. Capabilities are not an acceptance promise;
        disabling task admission does not remove metadata. The production 34 Tushare
        ranges remain NEEDS_VERIFICATION and six APIs remain SINGLE-only.
      responses:
        '200':
          description: Current metadata and readiness, with explicit nullable range semantics.
          headers:
            X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadCapabilitiesResponse'}
        '400': {$ref: '#/components/responses/DownloadTaskBadRequest'}
        '409': {$ref: '#/components/responses/DownloadTaskConflict'}
        '500': {$ref: '#/components/responses/DownloadTaskFailure'}
components:
  schemas:
    DownloadTaskSubmissionRequest:
      $ref: './download-task.schema.json#/$defs/SubmissionRequest'
    DownloadTaskControlRequest:
      $ref: './download-task.schema.json#/$defs/ControlRequest'
    DownloadTaskReceipt:
      $ref: './download-task.schema.json#/$defs/Receipt'
    DownloadTaskResponse:
      $ref: './download-task.schema.json#/$defs/TaskResponse'
    DownloadBatchResponse:
      $ref: './download-task.schema.json#/$defs/BatchResponse'
    DownloadTaskPage:
      $ref: './download-task.schema.json#/$defs/TaskPage'
    DownloadBatchPage:
      $ref: './download-task.schema.json#/$defs/BatchPage'
    DownloadCapabilitiesResponse:
      $ref: './download-task.schema.json#/$defs/CapabilitiesResponse'
    DownloadTaskError:
      $ref: './download-task.schema.json#/$defs/Error'
    DataSourceSummary:
      type: object
      additionalProperties: false
      required: [pluginId, displayName, description, enabled, credentialConfigured, downloadAvailable, unavailableReason]
      properties:
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        displayName: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        enabled: {type: boolean}
        credentialConfigured: {type: boolean}
        downloadAvailable: {type: boolean}
        unavailableReason: {type: [string, 'null']}
      allOf:
        - if: {properties: {downloadAvailable: {const: true}}, required: [downloadAvailable]}
          then: {properties: {unavailableReason: {type: 'null'}}}
        - if: {properties: {downloadAvailable: {const: false}}, required: [downloadAvailable]}
          then: {properties: {unavailableReason: {type: string, minLength: 1}}}
    ApiDescriptor:
      type: object
      additionalProperties: false
      required: [apiName, displayName, category, queryMode, parameters]
      properties:
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        displayName: {type: string, minLength: 1}
        category: {type: string, minLength: 1, maxLength: 64}
        queryMode: {enum: [trade_date, ann_date, snapshot, date_range]}
        parameters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, label, type, required]
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
              label: {type: string, minLength: 1}
              type: {enum: [DATE, DATE_RANGE_MEMBER, MONTH, TS_CODE, ENUM, TEXT]}
              required: {type: boolean}
              description: {type: string, minLength: 1}
              defaultValue: {type: string}
              allowedValues: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
              pattern: {type: string}
              relatedParameter: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
            allOf:
              - if: {properties: {type: {const: ENUM}}, required: [type]}
                then: {required: [allowedValues]}
              - if: {properties: {type: {const: DATE_RANGE_MEMBER}}, required: [type]}
                then: {required: [relatedParameter]}
    DatasetSummary:
      type: object
      additionalProperties: false
      required: [pluginId, apiName, displayName, category, queryMode, filters, fixedColumn]
      properties:
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        displayName: {type: string, minLength: 1}
        category: {type: string, minLength: 1, maxLength: 64}
        queryMode: {enum: [trade_date, ann_date, snapshot, date_range]}
        filters:
          type: array
          description: Ordered exactly as the M00-T02 metadata filters array; duplicate filter objects are not allowed.
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [field, operator, controlType]
            properties:
              field: {enum: [ts_code, trade_date, ann_date]}
              operator: {enum: [EQ, BETWEEN]}
              controlType: {enum: [TEXT, DATE_RANGE]}
            allOf:
              - if: {properties: {field: {const: ts_code}}, required: [field]}
                then: {properties: {operator: {const: EQ}, controlType: {const: TEXT}}}
              - if: {properties: {field: {enum: [trade_date, ann_date]}}, required: [field]}
                then: {properties: {operator: {const: BETWEEN}, controlType: {const: DATE_RANGE}}}
        fixedColumn:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Uses the metadata fixedColumn when configured; otherwise uses the first business field in metadata displayOrder.
    DatasetDefinitionResponse:
      type: object
      additionalProperties: false
      required: [pluginId, apiName, displayName, category, queryMode, filters, fixedColumn, columns]
      properties:
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        displayName: {type: string, minLength: 1}
        category: {type: string, minLength: 1, maxLength: 64}
        queryMode: {enum: [trade_date, ann_date, snapshot, date_range]}
        filters:
          type: array
          description: Ordered exactly as the M00-T02 metadata filters array; duplicate filter objects are not allowed.
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [field, operator, controlType]
            properties:
              field: {enum: [ts_code, trade_date, ann_date]}
              operator: {enum: [EQ, BETWEEN]}
              controlType: {enum: [TEXT, DATE_RANGE]}
            allOf:
              - if: {properties: {field: {const: ts_code}}, required: [field]}
                then: {properties: {operator: {const: EQ}, controlType: {const: TEXT}}}
              - if: {properties: {field: {enum: [trade_date, ann_date]}}, required: [field]}
                then: {properties: {operator: {const: BETWEEN}, controlType: {const: DATE_RANGE}}}
        fixedColumn:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Uses the metadata fixedColumn when configured; otherwise uses the first business field in metadata displayOrder.
        columns:
          type: array
          minItems: 1
          description: All business columns, ordered by ascending displayOrder.
          items:
            type: object
            additionalProperties: false
            required: [name, label, logicalType, nullable, displayOrder]
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
              label: {type: string, minLength: 1}
              logicalType: {enum: [STRING, TEXT, DATE, MONTH, LONG, DECIMAL, ENUM]}
              nullable: {type: boolean}
              displayOrder: {type: integer, minimum: 0}
              length: {type: integer, minimum: 1}
              precision: {type: integer, minimum: 1, maximum: 65}
              scale: {type: integer, minimum: 0, maximum: 30}
              allowedValues: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
              longText: {type: boolean}
            allOf:
              - if: {properties: {logicalType: {enum: [STRING, ENUM]}}, required: [logicalType]}
                then: {required: [length]}
              - if: {properties: {logicalType: {const: DECIMAL}}, required: [logicalType]}
                then: {required: [precision, scale]}
    DownloadRequest:
      type: object
      additionalProperties: false
      required: [pluginId, apiName, params]
      properties:
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        params:
          description: Parameters and required fields are defined by the selected API descriptor; stock-scoped APIs require a single ts_code without a default.
          type: object
          propertyNames: {pattern: '^[a-z][a-z0-9_]{1,63}$'}
          additionalProperties: {type: string}
    DownloadResponse:
      type: object
      additionalProperties: false
      required: [requestId, outcome, pluginId, apiName, sourceRowCount, insertedRows, updatedRows, message]
      properties:
        requestId: {type: string, minLength: 1}
        outcome: {enum: [SUCCESS, EMPTY]}
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        sourceRowCount: {type: integer, format: int64, minimum: 0}
        insertedRows: {type: integer, format: int64, minimum: 0}
        updatedRows: {type: integer, format: int64, minimum: 0}
        message: {type: string, minLength: 1}
      allOf:
        - if: {properties: {outcome: {const: EMPTY}}, required: [outcome]}
          then:
            properties:
              sourceRowCount: {maximum: 0}
              insertedRows: {maximum: 0}
              updatedRows: {maximum: 0}
        - if: {properties: {outcome: {const: SUCCESS}}, required: [outcome]}
          then: {properties: {sourceRowCount: {minimum: 1}}}
    PageResponse:
      type: object
      additionalProperties: false
      required: [requestId, pluginId, apiName, page, pageSize, totalElements, totalPages, columns, items]
      properties:
        requestId: {type: string, minLength: 1}
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, enum: [20, 50, 100], default: 50}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int64, minimum: 0}
        columns:
          type: array
          description: Business field names in metadata displayOrder, followed by source_plugin, source_api, and ingested_at.
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        items:
          type: array
          items:
            type: object
            propertyNames: {pattern: '^[a-z][a-z0-9_]{1,63}$'}
            additionalProperties: {type: [string, 'null']}
    ApiError:
      type: object
      additionalProperties: false
      required: [requestId, code, message, retryable, fieldErrors]
      properties:
        requestId: {type: string, minLength: 1, description: Must equal the X-Request-Id response header.}
        code:
          enum: [PARAM_REQUIRED, PARAM_INVALID, PLUGIN_DISABLED, DATASET_MISCONFIGURED, SOURCE_AUTH_FAILED, SOURCE_PERMISSION_DENIED, SOURCE_RATE_LIMITED, SOURCE_UNAVAILABLE, SOURCE_NETWORK_ERROR, SOURCE_TIMEOUT, SOURCE_PAYLOAD_INVALID, ADAPTER_FIELD_MISSING, ADAPTER_TYPE_INVALID, PERSISTENCE_FAILED, QUERY_FAILED, INTERNAL_ERROR, TASK_NOT_FOUND, SUBMISSION_CONFLICT, TASK_STATE_CONFLICT, TASK_DEFINITION_CHANGED, BATCH_DOWNLOAD_UNAVAILABLE, TASK_QUEUE_FULL, BATCH_COMPLETENESS_UNCONFIRMED, SOURCE_RANGE_MISMATCH, TASK_LIMIT_EXCEEDED, EXECUTION_INTERRUPTED]
        message: {type: string, minLength: 1}
        retryable: {type: boolean}
        fieldErrors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
  headers:
    TaskRequestId:
      required: true
      description: Matches requestId when the response body contains it; RequestIdFilter supplies this header for every response.
      schema: {$ref: './download-task.schema.json#/$defs/UUID'}
    DownloadTaskLocation:
      required: true
      description: Relative URL for the original task's detail resource, also returned on replay, retry and resume.
      schema: {type: string, pattern: '^/api/v1/download-tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
  parameters:
    DownloadTaskId:
      name: taskId
      in: path
      required: true
      description: Full 36-character UUID; uppercase hexadecimal is accepted and normalized to lowercase. Shortened UUID syntax is invalid.
      schema: {$ref: './download-task.schema.json#/$defs/UUID'}
    DownloadTaskPage:
      name: page
      in: query
      description: One-based decimal integer. No signs, spaces, fractions, exponents, overflow or duplicates. A page beyond the end is returned unchanged.
      schema: {type: integer, format: int32, minimum: 1, maximum: 2147483647, default: 1}
    DownloadTaskPageSize:
      name: pageSize
      in: query
      description: Decimal integer token with no signs, spaces, fractions, exponents or duplicates.
      schema: {type: integer, enum: [20, 50, 100], default: 20}
  responses:
    DownloadTaskBadRequest:
      description: PARAM_REQUIRED or PARAM_INVALID. Invalid present top-level values take precedence over missing values; field names are fixed and never echo raw input.
      headers:
        X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DownloadTaskError'}
    DownloadTaskNotFound:
      description: TASK_NOT_FOUND for an unknown well-formed task UUID.
      headers:
        X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DownloadTaskError'}
    DownloadTaskConflict:
      description: PLUGIN_DISABLED, DATASET_MISCONFIGURED, SUBMISSION_CONFLICT, TASK_STATE_CONFLICT, TASK_DEFINITION_CHANGED or BATCH_DOWNLOAD_UNAVAILABLE. Unexpected BATCH_COMPLETENESS_UNCONFIRMED, TASK_LIMIT_EXCEEDED or EXECUTION_INTERRUPTED also map to 409 at the HTTP error boundary.
      headers:
        X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DownloadTaskError'}
    DownloadTaskQueueFull:
      description: TASK_QUEUE_FULL; no new acceptance was committed by this attempt.
      headers:
        X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DownloadTaskError'}
    DownloadTaskFailure:
      description: >-
        PERSISTENCE_FAILED, QUERY_FAILED or INTERNAL_ERROR. A database commit may have
        succeeded before its receipt was lost. Query by taskId or submissionId;
        rollback is not guaranteed. Do not blindly change submissionId or resend a
        control request. An HTTP query failure does not alter stored task status.
      headers:
        X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DownloadTaskError'}
    DownloadTaskAdapterFailure:
      description: ADAPTER_FIELD_MISSING or ADAPTER_TYPE_INVALID unexpectedly reached the HTTP boundary. Stored failures are still queried with HTTP 200.
      headers:
        X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DownloadTaskError'}
    DownloadTaskSourceFailure:
      description: SOURCE_AUTH_FAILED, SOURCE_PERMISSION_DENIED, SOURCE_RATE_LIMITED, SOURCE_UNAVAILABLE, SOURCE_NETWORK_ERROR, SOURCE_PAYLOAD_INVALID or SOURCE_RANGE_MISMATCH unexpectedly reached the HTTP boundary. Stored failures are still queried with HTTP 200.
      headers:
        X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DownloadTaskError'}
    DownloadTaskSourceTimeout:
      description: SOURCE_TIMEOUT unexpectedly reached the HTTP boundary. A stored timeout is still queried with HTTP 200.
      headers:
        X-Request-Id: {$ref: '#/components/headers/TaskRequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DownloadTaskError'}
