openapi: 3.1.0
info:
  title: Tensor v1 REST API
  version: v1
  description: Shared REST target contract for Tensor v1 metadata, range downloads, current failure tasks, and read-only queries. RANGE-T03 updates documentation only; running endpoints have not yet migrated. Source evidence and live verification remain separate.
paths:
  /api/v1/data-sources:
    get:
      operationId: listDataSources
      responses:
        '200':
          description: Registered data sources.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DataSourceSummary'}}
        '500': &internalError
          description: Internal processing failure.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/data-sources/{pluginId}/apis:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: listPluginApis
      responses:
        '200':
          description: API descriptors for the data source.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ApiDescriptor'}}
        '409': &pluginDisabled
          description: A registered plugin is disabled.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500': *internalError
  /api/v1/downloads:
    post:
      operationId: downloadDataset
      description: One synchronous download. Validate input and source readiness, acquire the single-instance slot,
        confirm all necessary calendars before business calls. Explicit in-business source/adaptation/conflict failures
        are saved and execution continues through all planned ranges without automatic retry. Storage failure or unknown
        commit stops with an error and confirmed subtotals. No cancel/pause/stop endpoint or idempotency protocol;
        client disconnect does not cancel execution or release the slot, which remains held until actual completion.
        Request IDs trace only. Running endpoints have not yet migrated.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DownloadRequest'}
            examples:
              dailySameDay:
                value:
                  pluginId: tushare_pro
                  apiName: daily
                  params: {start_date: '20260901', end_date: '20260901'}
                summary: Target contract only; source and account capability are not verified.
              incomeRange:
                value:
                  pluginId: tushare_pro
                  apiName: income
                  params: {ts_code: 000001.SZ, start_date: '20260901', end_date: '20260910'}
                summary: Target contract only; source and account capability are not verified.
              marginRange:
                value:
                  pluginId: tushare_pro
                  apiName: margin
                  params: {exchange_id: SSE, start_date: '20260901', end_date: '20260910'}
                summary: Target contract only; source and account capability are not verified.
              brokerRecommendThreeMonths:
                value:
                  pluginId: tushare_pro
                  apiName: broker_recommend
                  params: {start_date: '20260131', end_date: '20260302'}
                summary: Target contract only; source and account capability are not verified.
              tradeCalendarSameDay:
                value:
                  pluginId: tushare_pro
                  apiName: trade_cal
                  params: {exchange: SSE, start_date: '20260901', end_date: '20260901'}
                summary: Target contract only; source and account capability are not verified.
              stockBasic:
                value:
                  pluginId: tushare_pro
                  apiName: stock_basic
                  params: {list_status: L}
                summary: Target contract only; source and account capability are not verified.
              indexClassify:
                value:
                  pluginId: tushare_pro
                  apiName: index_classify
                  params: {}
                summary: Target contract only; source and account capability are not verified.
      responses:
        '200':
          description: All planned ranges attempted; confirmed unit subtotals and currently saved failures.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadResponse'}
              examples:
                success:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    outcome: SUCCESS
                    pluginId: tushare_pro
                    apiName: daily
                    sourceRowCount: 10
                    insertedRows: 10
                    updatedRows: 0
                    message: 下载成功
                    completedUnits: 1
                    failedUnits: 0
                    notStartedUnits: 0
                    skippedClosedDates: 0
                    taskId: null
                    remainingFailedUnits: 0
                    failureRecordStatus: NOT_REQUIRED
                    failures: []
                    notStartedScopes: []
                    unconfirmedScopes: []
                partialUnits:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    outcome: PARTIAL
                    pluginId: tushare_pro
                    apiName: daily
                    sourceRowCount: 20
                    insertedRows: 18
                    updatedRows: 2
                    message: 完成 2 项，失败 1 项
                    completedUnits: 2
                    failedUnits: 1
                    notStartedUnits: 0
                    skippedClosedDates: 0
                    taskId: 11111111-1111-4111-8111-111111111111
                    remainingFailedUnits: 1
                    failureRecordStatus: CONFIRMED
                    failures:
                    - {targetType: STOCK, targetValue: 000002.SZ, timeType: DATE, timeValue: '2026-09-03', errorCode: ADAPTER_TYPE_INVALID,
                      errorMessage: 字段类型不符合定义}
                    notStartedScopes: []
                    unconfirmedScopes: []
                  summary: 受控合同示例，独立恢复未真实启用。
                empty:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    outcome: EMPTY
                    pluginId: tushare_pro
                    apiName: daily
                    sourceRowCount: 0
                    insertedRows: 0
                    updatedRows: 0
                    message: 下载成功，0 条数据
                    completedUnits: 1
                    failedUnits: 0
                    notStartedUnits: 0
                    skippedClosedDates: 0
                    taskId: null
                    remainingFailedUnits: 0
                    failureRecordStatus: NOT_REQUIRED
                    failures: []
                    notStartedScopes: []
                    unconfirmedScopes: []
                allClosed:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    outcome: NO_OPEN_DATES
                    pluginId: tushare_pro
                    apiName: daily
                    sourceRowCount: 0
                    insertedRows: 0
                    updatedRows: 0
                    message: 所选区间无开盘日期
                    completedUnits: 0
                    failedUnits: 0
                    notStartedUnits: 0
                    skippedClosedDates: 2
                    taskId: null
                    remainingFailedUnits: 0
                    failureRecordStatus: NOT_REQUIRED
                    failures: []
                    notStartedScopes: []
                    unconfirmedScopes: []
                allFailed:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    outcome: FAILED
                    pluginId: tushare_pro
                    apiName: daily
                    sourceRowCount: 0
                    insertedRows: 0
                    updatedRows: 0
                    message: 失败 1 项，已保存
                    completedUnits: 0
                    failedUnits: 1
                    notStartedUnits: 0
                    skippedClosedDates: 0
                    taskId: 11111111-1111-4111-8111-111111111111
                    remainingFailedUnits: 1
                    failureRecordStatus: CONFIRMED
                    failures:
                    - {targetType: REQUEST, targetValue: '', timeType: RANGE, timeValue: 2026-09-01/2026-09-02, errorCode: SOURCE_TIMEOUT,
                      errorMessage: 来源请求超时，请稍后手动重试}
                    notStartedScopes: []
                    unconfirmedScopes: []
        '400':
          description: Input invalid or required field missing; no business request. Old/mixed date parameters are
            rejected.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                invalidDateRange:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    code: PARAM_INVALID
                    message: 开始日期不能晚于结束日期
                    retryable: false
                    fieldErrors: []
        '409':
          description: Slot busy, plugin disabled, or source legal request unconfirmed; no new first-download task.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                busy:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    code: DOWNLOAD_BUSY
                    message: 已有下载执行中，请等待实际结束
                    retryable: true
                    fieldErrors: []
                sourceRequestUnconfirmed:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    code: SOURCE_REQUEST_UNCONFIRMED
                    message: 原接口合法请求方式未确认，未执行
                    retryable: false
                    fieldErrors: []
        '500':
          description: Current unit persistence failure, failure record save unconfirmed, or commit unknown. Previously
            committed units remain; stop and include any confirmed execution subtotals.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                recordSaveUnknown:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    code: TASK_RECORD_SAVE_UNCONFIRMED
                    message: 失败记录保存未确认，已停止
                    retryable: false
                    fieldErrors: []
                    downloadResult:
                      requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                      outcome: UNCONFIRMED
                      pluginId: tushare_pro
                      apiName: daily
                      sourceRowCount: 10
                      insertedRows: 10
                      updatedRows: 0
                      message: 结果未确认；计数仅包含此前确认项
                      completedUnits: 1
                      failedUnits: 1
                      notStartedUnits: null
                      skippedClosedDates: 0
                      taskId: null
                      remainingFailedUnits: null
                      failureRecordStatus: UNCONFIRMED
                      failures:
                      - {targetType: REQUEST, targetValue: '', timeType: DATE, timeValue: '2026-09-03', errorCode: SOURCE_TIMEOUT,
                        errorMessage: 来源请求超时，请稍后手动重试}
                      notStartedScopes:
                      - {targetType: REQUEST, targetValue: '', timeType: RANGE, timeValue: 2026-09-04/2026-09-10}
                      unconfirmedScopes: []
                commitUnknown:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    code: COMMIT_UNCONFIRMED
                    message: 当前范围提交结果未确认，已停止
                    retryable: false
                    fieldErrors: []
                    downloadResult:
                      requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                      outcome: UNCONFIRMED
                      pluginId: tushare_pro
                      apiName: daily
                      sourceRowCount: 10
                      insertedRows: 10
                      updatedRows: 0
                      message: 结果未确认；计数仅包含此前确认项
                      completedUnits: 1
                      failedUnits: 0
                      notStartedUnits: null
                      skippedClosedDates: 0
                      taskId: null
                      remainingFailedUnits: null
                      failureRecordStatus: UNCONFIRMED
                      failures: []
                      notStartedScopes:
                      - {targetType: REQUEST, targetValue: '', timeType: RANGE, timeValue: 2026-09-04/2026-09-10}
                      unconfirmedScopes:
                      - {targetType: REQUEST, targetValue: '', timeType: DATE, timeValue: '2026-09-03'}
        '502':
          description: Pre-business source or necessary calendar failure. In-business source failures are saved then
            continued and returned via 200 PARTIAL/FAILED.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                calendarUnconfirmed:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    code: CALENDAR_UNCONFIRMED
                    message: 日历未确认，未执行；已有失败项保留
                    retryable: true
                    fieldErrors: []
        '504':
          description: Pre-business source timeout. In-business timeouts are saved and later planned ranges continue.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/data-sources/{pluginId}/datasets:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: listPluginDatasets
      responses:
        '200':
          description: Dataset summaries.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DatasetSummary'}}
        '409': &datasetMisconfigured
          description: Dataset metadata is incomplete or inconsistent.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500': *internalError
  /api/v1/data-sources/{pluginId}/datasets/{apiName}:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
      - {name: apiName, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: getDatasetDefinition
      responses:
        '200':
          description: Full dataset display metadata.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetDefinitionResponse'}
        '409': *datasetMisconfigured
        '500': *internalError
  /api/v1/data-sources/{pluginId}/datasets/{apiName}/records:
    parameters:
      - {name: pluginId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
      - {name: apiName, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}}
    get:
      operationId: listDatasetRecords
      description: Each optional filter is accepted only when the selected dataset metadata declares the corresponding filter; an undeclared filter is rejected as PARAM_INVALID. A requested page beyond the valid range after data changes is normalized to the new last page.
      parameters:
        - {name: tsCode, in: query, required: false, description: Accepted only when dataset metadata declares the ts_code filter., schema: {type: string}}
        - {name: tradeDateFrom, in: query, required: false, description: Accepted only when dataset metadata declares the trade_date filter., schema: {type: string, format: date}}
        - {name: tradeDateTo, in: query, required: false, description: Accepted only when dataset metadata declares the trade_date filter., schema: {type: string, format: date}}
        - {name: annDateFrom, in: query, required: false, description: Accepted only when dataset metadata declares the ann_date filter., schema: {type: string, format: date}}
        - {name: annDateTo, in: query, required: false, description: Accepted only when dataset metadata declares the ann_date filter., schema: {type: string, format: date}}
        - {name: page, in: query, required: false, description: One-based requested page; an out-of-range page is normalized to the new last page., schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, enum: [20, 50, 100], default: 50}}
      responses:
        '200':
          description: A normalized page; an empty result has zero totals and an empty items array. An out-of-range request is returned as the new last page.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageResponse'}
              examples:
                records:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    pluginId: tushare_pro
                    apiName: daily
                    page: 1
                    pageSize: 50
                    totalElements: 1
                    totalPages: 1
                    columns: [ts_code, trade_date, open, volume, source_plugin, source_api, ingested_at]
                    items:
                      - {ts_code: 000001.SZ, trade_date: '2026-08-07', open: '11.230000000000000000', volume: '9223372036854775807', source_plugin: tushare_pro, source_api: daily, ingested_at: '2026-08-25T10:30:15.123+08:00'}
        '400':
          description: Query parameter validation failure.
          headers:
            X-Request-Id:
              required: true
              description: Matches the requestId in this error body.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                invalidDateRange:
                  value: {requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33, code: PARAM_INVALID, message: tradeDateFrom 不能晚于 tradeDateTo, retryable: false, fieldErrors: [{field: tradeDateFrom, message: 必须早于或等于 tradeDateTo}]}
        '409': *datasetMisconfigured
        '500': &queryFailed
          description: The read query could not be completed.
          headers:
            X-Request-Id: {required: true, schema: {type: string, minLength: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/retry-tasks:
    get:
      operationId: listRetryTasks
      description: Read current saved failures only; no slot acquisition or calendar/business calls. pluginId and
        apiName independently filter saved identifiers, including offline plugins. Sort updatedAt DESC, taskId DESC.
        Normalize beyond-end requests to last page; empty page=1, totalElements=totalPages=0, items=[].
      parameters:
      - name: pluginId
        in: query
        required: false
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
      - name: apiName
        in: query
        required: false
        schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
      - name: page
        in: query
        required: false
        schema: {type: integer, minimum: 1, default: 1}
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          enum: [20, 50, 100]
          default: 20
      responses:
        '200':
          description: Current failure task page.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetryTaskPage'}
              examples:
                tasks:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    page: 1
                    pageSize: 20
                    totalElements: 1
                    totalPages: 1
                    items:
                    - taskId: 11111111-1111-4111-8111-111111111111
                      pluginId: tushare_pro
                      apiName: margin
                      pluginDisplayName: Tushare Pro
                      apiDisplayName: 融资融券汇总
                      originalDateRange: {startDate: '20260901', endDate: '20260910'}
                      originalDateRangeStatus: RECORDED
                      failedItemCount: 2
                      failedScopes:
                      - {targetType: REQUEST, targetValue: '', timeType: DATE, timeValue: '2026-09-03'}
                      - {targetType: REQUEST, targetValue: '', timeType: DATE, timeValue: '2026-09-07'}
                      createdAt: '2026-09-08T01:30:15.123Z'
                      updatedAt: '2026-09-08T01:30:15.123Z'
                emptyTasks:
                  value:
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    page: 1
                    pageSize: 20
                    totalElements: 0
                    totalPages: 0
                    items: []
        '400':
          description: Invalid filter or pagination input.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500':
          description: 'QUERY_FAILED: current records could not be queried.'
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/retry-tasks/{taskId}:
    parameters:
    - &part2_001
      name: taskId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getRetryTask
      description: Read actual committed task and all current items without a slot or network checks. During execution
        this is a snapshot; no historical totals or inferred success. A missing task is 404.
      responses:
        '200':
          description: Current task, original input and exact failed selectors; no item pagination.
          headers:
            X-Request-Id:
              required: true
              description: Equals body requestId and any nested downloadResult.requestId.
              schema: {type: string, minLength: 1}
              example: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetryTaskDetail'}
              examples:
                detail:
                  value:
                    taskId: 11111111-1111-4111-8111-111111111111
                    pluginId: tushare_pro
                    apiName: margin
                    pluginDisplayName: Tushare Pro
                    apiDisplayName: 融资融券汇总
                    originalDateRange: {startDate: '20260901', endDate: '20260910'}
                    originalDateRangeStatus: RECORDED
                    failedItemCount: 2
                    failedScopes:
                    - {targetType: REQUEST, targetValue: '', timeType: DATE, timeValue: '2026-09-03'}
                    - {targetType: REQUEST, targetValue: '', timeType: DATE, timeValue: '2026-09-07'}
                    createdAt: '2026-09-08T01:30:15.123Z'
                    updatedAt: '2026-09-08T01:30:15.123Z'
                    requestId: c52bce3d-5aa5-4c8e-ae64-e73cb76d8f33
                    taskParams: {exchange_id: SSE, start_date: '20260901', end_date: '20260910'}
                    items:
                    - {targetType: REQUEST, targetValue: '', timeType: DATE, timeValue: '2026-09-03', errorCode: SOURCE_TIMEOUT,
                      errorMessage: 来源请求超时，请稍后手动重试, updatedAt: '2026-09-08T01:30:15.123Z'}
                    - {targetType: REQUEST, targetValue: '', timeType: DATE, timeValue: '2026-09-07', errorCode: SOURCE_TIMEOUT,
                      errorMessage: 来源请求超时，请稍后手动重试, updatedAt: '2026-09-08T01:30:15.123Z'}
                    retrying: false
                    canExecute: false
                    executionBlocker: {code: CALENDAR_UNCONFIRMED, message: 必要日历尚未确认；未发起来源请求}
