components:
  schemas:
    DataSourceSummary:
      type: object
      additionalProperties: false
      required: [pluginId, displayName, description, enabled, credentialConfigured, downloadAvailable, unavailableReason]
      properties:
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        displayName: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        enabled: {type: boolean}
        credentialConfigured: {type: boolean}
        downloadAvailable: {type: boolean, description: Only existing plugin and credential configuration readiness; not proof of source or calendar capability.}
        unavailableReason: {type: [string, 'null']}
      allOf:
        - if: {properties: {downloadAvailable: {const: true}}, required: [downloadAvailable]}
          then: {properties: {unavailableReason: {type: 'null'}}}
        - if: {properties: {downloadAvailable: {const: false}}, required: [downloadAvailable]}
          then: {properties: {unavailableReason: {type: string, minLength: 1}}}
    ApiDescriptor:
      type: object
      additionalProperties: false
      required: [apiName, displayName, category, queryMode, parameters, downloadPolicy]
      properties:
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        displayName: {type: string, minLength: 1}
        category: {type: string, minLength: 1, maxLength: 64}
        queryMode: {enum: [trade_date, ann_date, snapshot, date_range]}
        downloadPolicy: {$ref: '#/components/schemas/DownloadPolicy'}
        parameters:
          description: Download projection; 38 range targets replace old date fields with required start_date/end_date DATE_RANGE_MEMBER fields mutually relatedParameter, following preserved additional conditions. The 11 original parameter arrays remain unchanged. queryMode and dataset query filters are independent.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, label, type, required]
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
              label: {type: string, minLength: 1}
              type: {enum: [DATE, DATE_RANGE_MEMBER, MONTH, TS_CODE, ENUM, TEXT]}
              required: {type: boolean}
              description: {type: string, minLength: 1}
              defaultValue: {type: string}
              allowedValues: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
              pattern: {type: string}
              relatedParameter: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
            allOf:
              - if: {properties: {type: {const: ENUM}}, required: [type]}
                then: {required: [allowedValues]}
              - if: {properties: {type: {const: DATE_RANGE_MEMBER}}, required: [type]}
                then: {required: [relatedParameter]}
    DatasetSummary:
      type: object
      additionalProperties: false
      required: [pluginId, apiName, displayName, category, queryMode, filters, fixedColumn]
      properties:
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        displayName: {type: string, minLength: 1}
        category: {type: string, minLength: 1, maxLength: 64}
        queryMode: {enum: [trade_date, ann_date, snapshot, date_range]}
        filters:
          type: array
          description: Ordered exactly as the M00-T02 metadata filters array; duplicate filter objects are not allowed.
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [field, operator, controlType]
            properties:
              field: {enum: [ts_code, trade_date, ann_date]}
              operator: {enum: [EQ, BETWEEN]}
              controlType: {enum: [TEXT, DATE_RANGE]}
            allOf:
              - if: {properties: {field: {const: ts_code}}, required: [field]}
                then: {properties: {operator: {const: EQ}, controlType: {const: TEXT}}}
              - if: {properties: {field: {enum: [trade_date, ann_date]}}, required: [field]}
                then: {properties: {operator: {const: BETWEEN}, controlType: {const: DATE_RANGE}}}
        fixedColumn:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Uses the metadata fixedColumn when configured; otherwise uses the first business field in metadata displayOrder.
    DatasetDefinitionResponse:
      type: object
      additionalProperties: false
      required: [pluginId, apiName, displayName, category, queryMode, filters, fixedColumn, columns]
      properties:
        pluginId: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        apiName: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
        displayName: {type: string, minLength: 1}
        category: {type: string, minLength: 1, maxLength: 64}
        queryMode: {enum: [trade_date, ann_date, snapshot, date_range]}
        filters:
          type: array
          description: Ordered exactly as the M00-T02 metadata filters array; duplicate filter objects are not allowed.
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [field, operator, controlType]
            properties:
              field: {enum: [ts_code, trade_date, ann_date]}
              operator: {enum: [EQ, BETWEEN]}
              controlType: {enum: [TEXT, DATE_RANGE]}
            allOf:
              - if: {properties: {field: {const: ts_code}}, required: [field]}
                then: {properties: {operator: {const: EQ}, controlType: {const: TEXT}}}
              - if: {properties: {field: {enum: [trade_date, ann_date]}}, required: [field]}
                then: {properties: {operator: {const: BETWEEN}, controlType: {const: DATE_RANGE}}}
        fixedColumn:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Uses the metadata fixedColumn when configured; otherwise uses the first business field in metadata displayOrder.
        columns:
          type: array
          minItems: 1
          description: All business columns, ordered by ascending displayOrder.
          items:
            type: object
            additionalProperties: false
            required: [name, label, logicalType, nullable, displayOrder]
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9_]{1,63}$'}
              label: {type: string, minLength: 1}
              logicalType: {enum: [STRING, TEXT, DATE, MONTH, LONG, DECIMAL, ENUM]}
              nullable: {type: boolean}
              displayOrder: {type: integer, minimum: 0}
              length: {type: integer, minimum: 1}
              precision: {type: integer, minimum: 1, maximum: 65}
              scale: {type: integer, minimum: 0, maximum: 30}
              allowedValues: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
              longText: {type: boolean}
            allOf:
              - if: {properties: {logicalType: {enum: [STRING, ENUM]}}, required: [logicalType]}
                then: {required: [length]}
              - if: {properties: {logicalType: {const: DECIMAL}}, required: [logicalType]}
                then: {required: [precision, scale]}
    RangeParams:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      properties:
        start_date: &part3_001 {type: string, pattern: '^[0-9]{8}$', description: 'YYYYMMDD; strict Gregorian date, not
            ISO format:date.'}
        end_date: *part3_001
      description: Both endpoints are required with no defaults. Strict Gregorian dates, start_date <= end_date, inclusive
        range <=31 natural days BEFORE calendar filtering or full-month expansion. Same-day and 31-day inputs are valid;
        32 days, reversed or impossible dates are PARAM_INVALID. Schema checks shape; binder checks calendar and differences.
        Old trade_date/ann_date/month alone or mixed are PARAM_INVALID; missing required fields are PARAM_REQUIRED.
    StockRangeParams:
      type: object
      additionalProperties: false
      required: [ts_code, start_date, end_date]
      properties:
        ts_code: {type: string, pattern: '^\s*[A-Za-z0-9]+\.[A-Za-z0-9]+\s*$', description: One code.market value; binder
            trims and uppercases. No comma-separated stocks or six-digit-only restriction.}
        start_date: &part3_002 {type: string, pattern: '^[0-9]{8}$', description: 'YYYYMMDD; strict Gregorian date, not
            ISO format:date.'}
        end_date: *part3_002
      description: Both endpoints are required with no defaults. Strict Gregorian dates, start_date <= end_date, inclusive
        range <=31 natural days BEFORE calendar filtering or full-month expansion. Same-day and 31-day inputs are valid;
        32 days, reversed or impossible dates are PARAM_INVALID. Schema checks shape; binder checks calendar and differences.
